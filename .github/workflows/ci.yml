name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pybind11
        pip install -e .
        
    - name: Build C++ extension
      run: |
        cd cpp
        mkdir -p build
        cd build
        cmake ..
        cmake --build . --config Release
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Type check with mypy
      run: |
        mypy src/
        
    - name: Test with pytest
      run: |
        pytest tests/ -v
