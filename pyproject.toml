[build-system]
requires = ["setuptools >= 68.0", "setuptools-scm >= 8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odx"
version = "0.1.0"
description = "Options Desk Analytics — pricers, vol surface calibration, backtesting, market making, risk."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.11"
authors = [{name = "Megan Chan"}]
keywords = [
    "options", "derivatives", "quantitative-finance", "volatility",
    "black-scholes", "greeks", "risk", "backtesting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy >= 1.24",
    "scipy >= 1.10",
    "pandas >= 2.0",
    "pydantic >= 2.0",
    "pydantic-settings >= 2.0",
]

[project.optional-dependencies]
data = [
    "yfinance >= 0.2",
]
viz = [
    "matplotlib >= 3.7",
    "plotly >= 5.0",
    "streamlit >= 1.25",
]
dev = [
    "pytest >= 7.0",
    "pytest-cov >= 4.0",
    "hypothesis >= 6.0",
    "mypy >= 1.5",
    "ruff >= 0.1",
]
all = ["odx[data,viz,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
